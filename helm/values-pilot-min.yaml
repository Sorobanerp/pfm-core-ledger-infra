# FinOps Minimum Footprint for 5-User Family Pilot (~US$ 8/mo GCP / ~US$ 41/mo AWS)
replicaCount: 1

image:
  repository: ghcr.io/dantas-pfm/pfm-core-ledger-java
  tag: "1.0.0"
  pullPolicy: IfNotPresent

serviceAccount:
  name: pfm-core-ledger-sa

service:
  httpPort: 8080
  grpcPort: 9090

env:
  SERVER_PORT: "8080"
  GRPC_SERVER_PORT: "9090"
  JAVA_TOOL_OPTIONS: "-XX:+UseZGC -XX:MaxRAMPercentage=75.0 -Xms128m -Xmx224m"
  SPRING_THREADS_VIRTUAL_ENABLED: "true"
  DB_URL: "jdbc:postgresql://pfm-core-ledger-postgres.pfm-platform.svc.cluster.local:5432/pfm_core_ledger"
  KAFKA_BOOTSTRAP_SERVERS: "pfm-kafka.pfm-platform.svc.cluster.local:9092"
  OTEL_SERVICE_NAME: "pfm-core-ledger-java"

resources:
  requests:
    cpu: "100m"
    memory: "192Mi"
  limits:
    cpu: "250m"
    memory: "256Mi"

pdb:
  enabled: false
  minAvailable: 1

networkPolicy:
  enabled: true
  allowedIngressApp: "pfm-ingestion-bff-go"
