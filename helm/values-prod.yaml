replicaCount: 3

image:
  repository: ghcr.io/dantas-pfm/pfm-core-ledger-java
  tag: "1.0.0"
  pullPolicy: IfNotPresent

serviceAccount:
  name: pfm-core-ledger-sa
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::000000000000:role/pfm-core-ledger-java-irsa-prod"

service:
  httpPort: 8080
  grpcPort: 9090

env:
  JAVA_TOOL_OPTIONS: "-XX:+UseZGC -XX:+ZGenerational -XX:MaxRAMPercentage=75.0"
  SPRING_THREADS_VIRTUAL_ENABLED: "true"
  DB_URL: "jdbc:postgresql://pfm-core-ledger-rds.pfm-platform.internal:5432/pfm_core_ledger"
  KAFKA_BOOTSTRAP_SERVERS: "b-1.pfm-kafka.sa-east-1.amazonaws.com:9092"
  OTEL_SERVICE_NAME: "pfm-core-ledger-java"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.observability.svc.cluster.local:4318/v1/traces"

resources:
  requests:
    cpu: "500m"
    memory: "512Mi"
  limits:
    cpu: "2000m"
    memory: "1024Mi"

pdb:
  enabled: true
  minAvailable: 2

networkPolicy:
  enabled: true
  allowedIngressApp: "pfm-ingestion-bff-go"
