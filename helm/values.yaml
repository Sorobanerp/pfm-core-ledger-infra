replicaCount: 2

image:
  repository: ghcr.io/dantas-pfm/pfm-core-ledger-java
  tag: "1.0.0"
  pullPolicy: IfNotPresent

serviceAccount:
  name: pfm-core-ledger-sa
  annotations: {}

service:
  httpPort: 8080
  grpcPort: 9090

env:
  JAVA_TOOL_OPTIONS: "-XX:+UseZGC -XX:+ZGenerational -XX:MaxRAMPercentage=75.0"
  SPRING_THREADS_VIRTUAL_ENABLED: "true"
  DB_URL: "jdbc:postgresql://pfm-core-ledger-postgres.pfm-platform.svc.cluster.local:5432/pfm_core_ledger"
  KAFKA_BOOTSTRAP_SERVERS: "pfm-kafka.pfm-platform.svc.cluster.local:9092"
  OTEL_SERVICE_NAME: "pfm-core-ledger-java"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.observability.svc.cluster.local:4318/v1/traces"

resources:
  requests:
    cpu: "250m"
    memory: "384Mi"
  limits:
    cpu: "1000m"
    memory: "768Mi"

pdb:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true
  allowedIngressApp: "pfm-ingestion-bff-go"
